name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 发布门禁：tag 与版本号一致 + 全量测试通过 ─────────────────────────
  verify:
    name: Verify tag & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 tag 与 Cargo.toml 版本一致
        run: |
          V="${GITHUB_REF_NAME#v}"
          W=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$V workspace=$W"
          if [ "$V" != "$W" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 Cargo.toml 版本 $W 不一致，拒绝发布"
            exit 1
          fi
      - name: 校验 tag 指向 main 上的提交
        run: |
          git fetch --no-tags origin main
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME 的提交 $(git rev-parse --short HEAD) 不在 main 上，拒绝发布"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 前端与 CI 配置自检
        run: |
          node tools/check-js.js
          node tools/check-ci.js
      # 发布不能只看 cargo test：E2E、变异测试、check-js 都在 ci.yml。
      # 等待该提交的完整 CI 变绿；失败/取消立即拒绝，超时也拒绝。
      - name: 等待该提交的 CI 全绿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT_SHA}&per_page=1")
            count=$(echo "$run" | jq '.workflow_runs | length')
            if [ "$count" -eq 0 ]; then
              echo "尚未找到 CI run（${i}/80），等待…"
              sleep 30
              continue
            fi
            status=$(echo "$run" | jq -r '.workflow_runs[0].status')
            conclusion=$(echo "$run" | jq -r '.workflow_runs[0].conclusion // ""')
            echo "CI status=$status conclusion=$conclusion（${i}/80）"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "该提交的 CI 已全绿"
                exit 0
              fi
              echo "::error::该提交的 CI 未通过（$conclusion），拒绝发布"
              exit 1
            fi
            sleep 30
          done
          echo "::error::等待 CI 超时，拒绝发布"
          exit 1
      # 这一 job 以前还会再跑一遍 `cargo test --workspace`，作为「发布门禁」。
      # 那是重复的，而且比 CI 弱：CI 那边除了 test 还有变异测试（67 条）、clippy、
      # E2E、audit/deny/udeps。既然上面已经**等到了同一 SHA 的 CI 全绿**，再跑一遍
      # 只是把发版时间乘二 —— v1.8.38 实测 Release 21.2 分钟里 15.8 分钟花在这上面
      # （Windows 桌面 job 加固后只要 2.7 分钟）。
      #
      # 删掉的是重复的那一遍，不是门禁：门禁就是上面那次 CI。真要手动跑，
      # 本地 `cargo test --workspace` 与 CI 完全等价。

  # ── 桌面版（Linux x64） ──────────────────────────────────────────────
  desktop-linux:
    name: Desktop (Linux x64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build desktop
        run: cargo build --release --locked -p finbook
      - name: 生成示例账套
        # 发布包里必须带一份**有数据**的示例账套：新手打开空白账套什么也
        # 学不到，先看到「记完一个月账应该长什么样」才有参照。
        run: |
          cargo run --release --locked -p findb --example create -- dist/示例账套.fbk
          cargo run --release --locked -p findb --example demo   -- dist/示例账套.fbk
      - name: package
        run: |
          mkdir -p dist/pack
          cp target/release/finbook docs/新手使用说明.txt dist/示例账套.fbk dist/pack/
          # 发布说明随包一起上传：Publish job 只下载 artifact、不 checkout
          # 仓库，工作目录里没有 docs/，说明文件必须搭这个便车。
          mkdir -p dist/docs-releases
          cp "docs/releases/${GITHUB_REF_NAME}.md" dist/docs-releases/ 2>/dev/null \
            || echo "::warning::没有 docs/releases/${GITHUB_REF_NAME}.md，发布将用自动生成的说明"
          tar -C dist/pack -czf "dist/finbook-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*

  # ── 桌面版（Windows x64，mingw 交叉编译） ────────────────────────────
  desktop-windows:
    name: Desktop (Windows x64)
    needs: verify
    runs-on: ubuntu-latest
    # 这个 job 是整条发版流水线里最长的一段（交叉编译 GUI 约 12~15 分钟）。
    # 不设限时的话，apt 一卡就是 6 小时默认值 —— v1.8.38 那次 tag 之后
    # Release 挂了 45 分钟还没完，正是这一句没加固的 `apt-get update` 造成的。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: 安装 mingw-w64（与 ci.yml 同一套加固，改一处要改两处）
        timeout-minutes: 14
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # 一行写完：check-ci 会逐行检查引号是否成对（跨行续写的引号串会被判成「引号不成对」）。
          OPT="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true"
          # 总预算 10 分钟，留 4 分钟把失败原因说清楚（v1.8.40 那次 12 分钟整被 step timeout
          # 掐断，日志里只剩 cancelled，看不出是 apt 的锅）。
          deadline=$((SECONDS + 600))
          have() { x86_64-w64-mingw32-gcc --version | head -1; }
          # 第一次先不 update：runner 镜像自带 apt 索引，装得上就省掉整条 mirror 往返。
          if sudo timeout 150 apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64; then
            echo "mingw 装好了（未 update）"; have; exit 0
          fi
          echo "没 update 直接装失败，改为带 update 重试"
          for i in 1 2 3; do
            if [ $SECONDS -ge $deadline ]; then echo "预算用完，停止重试"; break; fi
            echo "=== 第 ${i} 次 ==="
            sudo timeout 120 apt-get $OPT update || echo "update 失败或超时，继续试 install（本地索引可能还是可用的）"
            if sudo timeout 150 apt-get $OPT install -y --no-install-recommends gcc-mingw-w64-x86-64; then
              echo "mingw 装好了"; have; exit 0
            fi
            sleep 10
          done
          echo "::error::mingw-w64 装不上（apt 重试尽失败）——这是 runners 的 apt/mirror 问题，不是代码问题；重跑这个 job 通常就过了"
          exit 1
      - name: build desktop
        timeout-minutes: 30
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p finbook
      - name: 生成示例账套
        run: |
          cargo run --release --locked -p findb --example create -- dist/示例账套.fbk
          cargo run --release --locked -p findb --example demo   -- dist/示例账套.fbk
      - name: package
        run: |
          mkdir -p dist/pack
          cp target/x86_64-pc-windows-gnu/release/finbook.exe \
             docs/新手使用说明.txt dist/示例账套.fbk dist/pack/
          # 说明文件跟着走（Publish 靠它生成 Release 正文，见 Linux job 同处注释）
          mkdir -p dist/docs-releases
          cp "docs/releases/${GITHUB_REF_NAME}.md" dist/docs-releases/ 2>/dev/null || true
          # 不能用 zip -j（会拍平目录名，中文文件名也容易在 Windows 下乱码）；
          # 保持包内一层目录，解压出来就是一个能直接双击的文件夹。
          (cd dist/pack && zip -r "../finbook-${GITHUB_REF_NAME#v}-windows-x86_64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*

  # ── 服务器版（Linux x64：finweb + static + systemd 单元） ─────────────
  server-linux:
    name: Server (Linux x64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build finweb
        run: cargo build --release --locked -p finweb
      - name: package
        run: |
          mkdir -p dist/server
          cp target/release/finweb dist/server/
          cp -r crates/finweb/static dist/server/static
          rm -f dist/server/static/util.test.js
          cp deploy/finweb.service dist/server/
          tar -C dist/server -czf "dist/finweb-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: dist/*

  # ── 汇总并发布到 GitHub Release ─────────────────────────────────────
  publish:
    name: Publish
    needs: [desktop-linux, desktop-windows, server-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        # 不能写成 `sha256sum * > SHA256SUMS`：shell 先展开通配符，而此时
        # SHA256SUMS 已被重定向创建（空文件），于是它把自己也算进去 ——
        # 读一个正在被写的文件，结果不稳定。2026-10-12 的 v1.1.0 发布就是这么
        # 红的：四个 job 里三个成功，Publish 卡在这一步。
        # 显式列出要算的文件，绕开通配符。
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 上一步已经 cd 到 dist/，但那只是那一个 step —— 每个 step 都是新 shell，
          # 这里的工作目录是仓库根。上一版我在本 step 里找 docs/releases/*.md，
          # 在 dist/ 下当然找不到，静默退回了 --generate-notes（没报错，所以更难发现）。
          # 统一用 $GITHUB_WORKSPACE 显式定位，不再依赖当前目录。
          cd "$GITHUB_WORKSPACE"

          # 只上传归档与校验和：download-artifact 合并后 dist/ 下有子目录，
          # 而 `dist/*` 会把子目录也匹配进来，gh release upload 遇到目录会失败
          # （和上面 sha256sum 同一个坑）。
          ASSETS=()
          for f in dist/*.tar.gz dist/*.zip dist/SHA256SUMS; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::dist/ 下没有找到任何发布产物，打包步骤可能全失败了"
            ls -la dist/ || true
            exit 1
          fi
          echo "将上传 ${#ASSETS[@]} 个文件："
          printf '  %s\n' "${ASSETS[@]}"

          # 说明文件不能从工作目录读：download-artifact 只拉 artifact，
          # 并不 checkout 仓库，所以 $GITHUB_WORKSPACE 里没有 docs/。
          # （前两版分别栽在「相对路径 cd dist」和「目录里压根没源码」上，
          #   两次都是被 [ -f ] 守卫静默吞掉，日志看起来一切正常。）
          # 所以各打包 job 把说明文件一并塞进 artifact，这里从 dist/ 读。
          NOTES=""
          for cand in dist/docs-releases/*.md dist/*-release-notes.md; do
            if [ -f "$cand" ]; then NOTES="$cand"; break; fi
          done
          if [ -n "$NOTES" ]; then
            echo "使用发布说明：$NOTES"
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            echo "::warning::未找到发布说明文件，改用自动生成的提交列表"
            echo "候选："; ls -la dist/ || true
            NOTES_ARGS=(--generate-notes)
          fi

          # 先 create 再 upload，不用 `gh release view` 探测。
          # 原因：v1.1.0 第二次发布踩过——删除 tag 会连带删掉它指向的
          # Release，而 `gh release view` 在「tag 存在但 Release 不存在」
          # 时的退出码并不可靠，于是走进了 upload 分支。upload **不会创建**
          # Release，于是 job 显示 success，Release 却根本没建出来
          # （API 查 tag 得到 404）。这种「绿但没产物」比直接报错更难查。
          #
          # create 撞上已存在的 Release 会失败，此时再退回 upload 覆盖。
          if gh release create "$GITHUB_REF_NAME" \
               --repo "$GITHUB_REPOSITORY" \
               --verify-tag \
               --title "FinBook ${GITHUB_REF_NAME}" \
               "${NOTES_ARGS[@]}" \
               "${ASSETS[@]}"; then
            echo "已创建 Release $GITHUB_REF_NAME"
          else
            echo "Release 已存在，改为覆盖上传产物"
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            # 正文也一并更新（upload 只换附件，不改正文）
            if [ -n "$NOTES" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES" --repo "$GITHUB_REPOSITORY"
            fi
          fi
