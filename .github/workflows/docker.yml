name: Docker Image

# 发布 Web 端容器镜像到 GitHub Container Registry。
#
# 为什么单独一个 workflow、而不塞进 release.yml：
#   release.yml 的 publish job 只做 Release 附件，跑完就结束；镜像构建要
#   十几分钟，失败原因也完全不同（buildx / 缓存 / 权限）。混在一起时，
#   镜像失败会把「Release 已发出去」这件事盖掉，排查时先看到的是红叉。
#
# 什么时候跑：
#   - 打 tag（v1.8.20 这种）→ 自动构建推送，并顺手打 minor / latest
#   - 手动 dispatch → 用当前分支或指定 tag 重出一版（缓存坏了、要补发时用）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要重出镜像的 tag（如 v1.8.20，留空则用当前 ref）"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 镜像内容的版本号必须等于源码里的版本号。tag 打错了、或忘了改
      # Cargo.toml，这里就红 —— 和 release.yml 的第一道门禁同一个理由：
      # 让人能靠 tag 反推镜像里到底是什么。
      - name: 校验版本号一致
        run: |
          W=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          case "${{ inputs.tag || github.ref_name }}" in
            v*) T="${{ inputs.tag || github.ref_name }}"; T="${T#v}" ;;
            *)  T="" ;;
          esac
          echo "镜像版本 tag=$T / Cargo.toml=$W"
          if [ -n "$T" ] && [ "$T" != "$W" ]; then
            echo "::error::tag $T 与 Cargo.toml 版本 $W 不一致，拒绝出镜像"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签策略：
      #   1.8.20  精确版本（生产钉这个，Dockge 要看得到更新就靠它）
      #   1.8     次版本浮动（收补丁）
      #   latest  只给正式 tag，dispatch 重出时不覆盖 latest
      #           —— 免得用旧 tag 重跑一次就把 latest 退回去
      - name: 计算标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 只出 amd64。多数工厂机器和 VPS 都是 x86_64；加 arm64 要么走 QEMU
          # 模拟（Rust release 构建会拖到一小时以上），要么换 arm runner。
          # 真有 ARM NAS 要装，再单独加一个 ubuntu-24.04-arm 任务原生构建。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 独立的 cache scope：ci.yml 的 docker job 也用 type=gha，默认 scope
          # 相同，两个 workflow 同时写会互相顶掉对方的缓存层。
          cache-from: type=gha,scope=docker-publish
          cache-to: type=gha,mode=max,scope=docker-publish
          provenance: false

      - name: 汇总
        run: |
          echo "### 已推送镜像" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Dockge 部署用的 compose 在仓库 \`deploy/docker-compose.yml\`。" >> "$GITHUB_STEP_SUMMARY"
