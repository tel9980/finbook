# cargo-audit 配置（CI `.github/workflows/ci.yml` 的 audit 任务读取）
[advisories]
ignore = [
    # RUSTSEC-2026-0187 — lopdf 0.31（经 printpdf 0.7.0 传入）"深层嵌套 PDF 对象栈溢出"。
    # 该漏洞需要**解析**不可信 PDF 才可触发；本项目 lopdf 仅用于**写出**报表 PDF
    # （crates/finweb/src/pdf.rs），从不解析外部 PDF，攻击面不可达。
    # 升级路径：printpdf 0.12 是 azul 重构、API 不兼容，需重写 pdf.rs（见 SECURITY_TODO L 系列跟踪）。
    "RUSTSEC-2026-0187",

    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 — quick-xml 0.30（二次复杂度 / NsReader 内存耗尽）。
    # 残留实例来自 egui 桌面端 Linux 无障碍链：zbus_xml 4.0 ← atspi ← accesskit_unix ← egui-winit，
    # 版本由上游 accesskit/zbus 锁死（quick-xml 0.x 语义化版本无法跨 0.30→0.41 升级），本地不可修；
    # 解析对象是系统 AT-SPI D-Bus XML，非用户输入。
    # 注：可升级的另一实例（calamine 0.26→0.36 的 quick-xml 0.31，xlsx 导入攻击面）已升级移除。
    # 待 accesskit/egui 上游升级 zbus_xml 后删除本两条。
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # RUSTSEC-2026-0367 / 0368 / 0369 — zip 2.4.2 与 8.6.0（经 calamine 0.36 /
    # rust_xlsxwriter 0.80 传入）"提取归档时保留 SUID/SGID 位 / 符号链接指向解压目录之外"。
    # 三条都需要调用 `ZipArchive::extract()` / `ZipStreamReader::extract()`（把归档
    # **写盘**）才可触发。本项目全仓没有一处 extract()：zip 只用于「读 Excel(.xlsx) 的
    # 归档结构」（findb/imports.rs 的 check_zip_bomb：ZipArchive::new + by_index + size），
    # calamine / rust_xlsxwriter 亦只在内存里读写，从不落盘解压。攻击面不可达。
    # 升级路径：需 zip >= 9.0.0，而 8.6.0 由 calamine / rust_xlsxwriter 锁死，上游未跟进；
    # 待其发布兼容版本后随依赖升级一并移除本三条。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # RUSTSEC-2026-0429 — zip「`ZipArchive::extract()` 遇到声明尺寸巨大的符号链接条目会
    # 按声明尺寸 `Vec::with_capacity` 预分配，分配失败直接 abort 进程」（CVSS 7.5，DoS）。
    # 与上面三条同一类：触发点是 `extract()`——
    # 全仓 grep 无一处 `.extract(`，zip 只用于「读 .xlsx 的归档结构」（findb/imports.rs
    # 的 check_zip_bomb：ZipArchive::new + by_index + size）与「生成备份包」，
    # 从不把归档解压落盘，攻击面不可达。
    # 补丁版本 zip >= 9.0.0；三个实例（0.6.6 / 2.4.2 / 8.6.0）分别由
    # rust_xlsxwriter 0.15 / rust_xlsxwriter 0.80 / calamine 0.36 锁死，本地不可升。
    # 解除条件：calamine / rust_xlsxwriter 跟到 zip 9 之后删除本条。
    "RUSTSEC-2026-0429",
]
