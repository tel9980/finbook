[workspace]
resolver = "2"
members = ["crates/fincore", "crates/findb", "crates/finui", "crates/finbook", "crates/finweb"]

[workspace.package]
version = "1.8.63"
edition = "2021"
license = "MIT"
authors = ["FinBook"]

[workspace.dependencies]
fincore = { path = "crates/fincore" }
findb = { path = "crates/findb" }
finui = { path = "crates/finui" }

chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-str", "std"] }
rust_xlsxwriter = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Web 服务端
axum = { version = "0.7", features = ["multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "catch-panic", "compression-gzip"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
# 开放 API 密钥哈希：快哈希（sha2）而非 argon2。
# 密钥是 32 字节随机熵，没有低熵口令可「猜」；慢哈希的存在意义是拖慢暴力破解，
# 用在这里只会让**每个 API 请求**都付 ~100ms，与外部系统对接的吞吐直接冲突。
sha2 = "0.10"

# dev/test 默认是 `debug = 2`（完整 DWARF：变量、类型、泛型实例的每一份）。
# 这个仓库泛型用得多（`Money`/`ReportTable`/axum 的 handler Future 每处都实例化一次），
# 完整调试信息能占到产物的 6 成以上：`libfinweb-*.rlib` 单份 259MB。
#
# 实测（同一份代码，只改这一个开关）：
#   debug = 2（默认）  259.0 MB
#   debug = 1          157.8 MB   （-39%）
#   debug = 0           98.5 MB   （-62%）
#
# `debug = 1` 保留**行号表**：panic 的 backtrace 依然打印 `文件:行`，日常定位够用；
# 丢掉的只是「在 gdb/lldb 里看变量值」。真要单步调变量，临时用
#   CARGO_PROFILE_DEV_DEBUG=2 cargo build -p finweb
# 覆盖回来即可，不需要改这个文件。
[profile.dev]
debug = 1

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
# panic 保持默认 unwind：Web 端靠 CatchPanicLayer 把单个请求的 panic 兜成 500，
# abort 会让任何请求路径上的 unwrap 直接打挂整个进程（全租户下线）。
# 桌面端不需要"一崩全崩"的语义，继续由 UI 层兜错即可。
